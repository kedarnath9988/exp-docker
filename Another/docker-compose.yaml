name: expense 
networks:
  default:
    name: expense 
volumes:
  default:
    name: expense 
    external: true 
services:
    mysql:
      image: mysql:1.0 
      container_name: mysql 
      volumes:
        - expnse:/var/lib/mysql
    backend:
      image: backend:1.1
      container_name: bakend 
      depends_on:
        - mysql 
    frontend:
      image: frontend:1.0 
      container_name: frontend 
      depends_on:
        - backend 
      expose:
        - 80:80
